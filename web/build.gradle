apply plugin: "gwt"
apply plugin: "war"

gwt {
  gwtVersion = "$gwtFrameworkVersion"
  maxHeapSize = '2G'
  minHeapSize = '1G'
  src = files(file('src/main/java'))
  modules 'io.github.rodcampos21.contosdoabismo.GdxDefinition'
  devModules 'io.github.rodcampos21.contosdoabismo.GdxDefinition'
  project.webAppDirName = 'webapp'
  compiler.strict = true
  compiler.disableCastChecking = true
}

dependencies {
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
  implementation "com.google.jsinterop:jsinterop-annotations:2.0.2:sources"
  implementation project(':core')
}

sourceSets.main.compileClasspath += files(project(':core').sourceSets.main.allJava.srcDirs)

task dist(dependsOn: [clean, compileGwt]) {
  doLast {
    file("build/dist").mkdirs()
    copy {
      from("build/gwt/out")
      into "build/dist"
    }
    copy {
      from("webapp")
      into "build/dist"
    }
    copy {
      from("war")
      into "build/dist"
    }
  }
}

eclipse.project.name = appName + "-web"
