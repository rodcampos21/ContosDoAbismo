name: Build

on:
  push:
    branches: [main, libgdx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar (desktop + web)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lwjgl3:jar web:dist
      - name: Publicar versão web em branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then BR=gh-pages; else BR=preview-web; fi
          mkdir -p web/build/dist/download
          cp lwjgl3/build/libs/*.jar web/build/dist/download/ || true
          cd web/build/dist
          touch .nojekyll
          git init -q
          git checkout -q -b "$BR"
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
