name: Build e Deploy

on:
  push:
    branches: [main, libgdx]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar (desktop + web)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lwjgl3:jar web:dist
      - name: Artefato web
        uses: actions/upload-artifact@v4
        with:
          name: game-web
          path: web/build/dist
      - name: Artefato desktop
        uses: actions/upload-artifact@v4
        with:
          name: game-desktop
          path: lwjgl3/build/libs/*.jar
      - name: Preparar Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
